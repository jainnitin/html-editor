name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tagName:
        description: 'Existing release tag to publish, for example v1.0.0'
        required: true
        type: string

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tagName || github.ref_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            platform: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - name: macOS Intel
            platform: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - name: Windows x64
            platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: --target x86_64-pc-windows-msvc

    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: npm ci

      # Materialise the App Store Connect API key (.p8) so Tauri can notarize
      # with it. Only the macOS runners need it; the file lands in RUNNER_TEMP,
      # which is wiped when the job ends.
      - name: Write Apple API key
        if: runner.os == 'macOS'
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/apple_api_key.p8"

      - name: Build and publish Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Telemetry is compiled in only for released builds; a source build
          # with these unset reports nothing.
          VITE_AI_INGEST: ${{ secrets.VITE_AI_INGEST }}
          VITE_AI_IKEY: ${{ secrets.VITE_AI_IKEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Apple Developer ID signing + notarization (macOS runners only; these
          # are simply unused on the Windows runner). tauri-action imports
          # APPLE_CERTIFICATE into a temporary keychain, signs the .app/.dmg with
          # a hardened runtime and secure timestamp, then notarizes with the App
          # Store Connect API key and staples the ticket.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/apple_api_key.p8
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: HTML Editor ${{ env.RELEASE_TAG }}
          # The release notes are exactly this short, friendly message — no
          # auto-generated list of internal commits.
          releaseBody: |
            Installed copies update themselves — open HTML Editor and it will offer this version.
            First time here? Download the installer for your platform below.
          generateReleaseNotes: false
          # Kept a draft until every platform has uploaded. GitHub never
          # resolves /releases/latest to a draft, so installed apps keep seeing
          # the previous complete release rather than a half-built one.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}

      # tauri-action notarizes the .app but not the .dmg wrapper, so a freshly
      # downloaded dmg would warn on open. Notarize + staple the dmg itself and
      # replace the uploaded asset so opening the installer is clean too.
      - name: Notarize and staple the macOS DMG
        if: runner.os == 'macOS'
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          DMG=$(ls src-tauri/target/*/release/bundle/dmg/*.dmg | head -1)
          echo "Notarizing $DMG"
          xcrun notarytool submit "$DMG" \
            --key "$RUNNER_TEMP/apple_api_key.p8" \
            --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER" --wait
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"
          gh release upload "$RELEASE_TAG" "$DMG" --clobber --repo "$GITHUB_REPOSITORY"

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tagName || github.ref_name }}
    steps:
      # Until now the release has been a draft, so `latest.json` listed only the
      # platforms that happened to finish first. A macOS build finishes minutes
      # before Windows, and an update check in that window failed with "none of
      # the fallback platforms were found". Publishing once, at the end, means
      # every platform appears at the same instant.
      - name: Verify every platform is present, then publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern latest.json --output latest.json --clobber

          echo "Platforms in latest.json:"
          jq -r '.platforms | keys[]' latest.json

          for p in darwin-aarch64 darwin-x86_64 windows-x86_64; do
            jq -e --arg p "$p" '.platforms | has($p)' latest.json >/dev/null \
              || { echo "::error::$p missing from latest.json — not publishing"; exit 1; }
          done

          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
          echo "Published $RELEASE_TAG with all platforms."
