name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tagName:
        description: 'Existing release tag to publish, for example v1.0.0'
        required: true
        type: string

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tagName || github.ref_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            platform: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - name: macOS Intel
            platform: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - name: Windows x64
            platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: --target x86_64-pc-windows-msvc

    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and publish Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Telemetry is compiled in only for released builds; a source build
          # with these unset reports nothing.
          VITE_AI_INGEST: ${{ secrets.VITE_AI_INGEST }}
          VITE_AI_IKEY: ${{ secrets.VITE_AI_IKEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: HTML Editor ${{ env.RELEASE_TAG }}
          # Prepended to GitHub's generated notes, which list the actual
          # changes. The old fixed body told an existing user nothing about
          # what they were being offered.
          releaseBody: |
            Installed copies update themselves — open HTML Editor and it will offer this version.
            First time here? Download the installer for your platform below.
          generateReleaseNotes: true
          # Kept a draft until every platform has uploaded. GitHub never
          # resolves /releases/latest to a draft, so installed apps keep seeing
          # the previous complete release rather than a half-built one.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tagName || github.ref_name }}
    steps:
      # Until now the release has been a draft, so `latest.json` listed only the
      # platforms that happened to finish first. A macOS build finishes minutes
      # before Windows, and an update check in that window failed with "none of
      # the fallback platforms were found". Publishing once, at the end, means
      # every platform appears at the same instant.
      - name: Verify every platform is present, then publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern latest.json --output latest.json --clobber

          echo "Platforms in latest.json:"
          jq -r '.platforms | keys[]' latest.json

          for p in darwin-aarch64 darwin-x86_64 windows-x86_64; do
            jq -e --arg p "$p" '.platforms | has($p)' latest.json >/dev/null \
              || { echo "::error::$p missing from latest.json — not publishing"; exit 1; }
          done

          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
          echo "Published $RELEASE_TAG with all platforms."
