<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HTML Editor</title>
<link rel="stylesheet" href="/src/styles.css">
</head>
<body>

<div id="fmtbar" class="locked">
  <button class="tb" data-cmd="undo" title="Undo — ⌘Z">
    <svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5A5.5 5.5 0 0 1 20 14.5 5.5 5.5 0 0 1 14.5 20H11"/></svg>
  </button>
  <button class="tb" data-cmd="redo" title="Redo — ⇧⌘Z">
    <svg viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5A5.5 5.5 0 0 0 4 14.5 5.5 5.5 0 0 0 9.5 20H13"/></svg>
  </button>

  <span class="sep"></span>

  <button class="tb" data-cmd="bold" title="Bold — ⌘B"><b>B</b></button>
  <button class="tb" data-cmd="italic" title="Italic — ⌘I"><i>I</i></button>
  <button class="tb" data-cmd="underline" title="Underline — ⌘U"><u>U</u></button>
  <button class="tb" data-cmd="strikeThrough" title="Strikethrough — ⇧⌘X"><s>S</s></button>

  <span class="sep"></span>

  <button class="tb" id="link" title="Add or edit link — ⌘K">
    <svg viewBox="0 0 24 24"><path d="M9 17H7A5 5 0 0 1 7 7h2"/><path d="M15 7h2a5 5 0 1 1 0 10h-2"/><path d="M8 12h8"/></svg>
  </button>
  <button class="tb" data-cmd="unlink" title="Remove link">
    <svg viewBox="0 0 24 24"><path d="M9 17H7A5 5 0 0 1 7 7h2"/><path d="M15 7h2a5 5 0 1 1 0 10h-2"/><path d="M4 20 20 4" class="slash"/></svg>
  </button>

  <span class="sep"></span>

  <button class="tb" id="find" title="Find &amp; replace — ⌘F">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20.5 20.5-4.2-4.2"/></svg>
  </button>
  <button class="tb" id="trim" title="Trim blocks — click any block to delete it (⌘D)">
    <svg viewBox="0 0 24 24"><circle cx="6" cy="6" r="2.6"/><circle cx="6" cy="18" r="2.6"/><path d="M20 4 8.2 15.8"/><path d="m14.5 14.5 5.5 5.5"/><path d="M8.2 8.2 12 12"/></svg>
  </button>
  <button class="tb" id="links" title="Link audit — ⇧⌘L">
    <svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13"/><path d="M3.5 6h.01M3.5 12h.01M3.5 18h.01" class="dots"/></svg>
  </button>

  <span class="grow"></span>
  <span id="savestate"></span>

  <div class="modepick">
    <button id="modebtn" aria-haspopup="menu" aria-expanded="false" title="Document mode">
      <span id="modeicon"></span>
      <span id="modelabel">Editing</span>
      <svg class="chev" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>
    </button>
    <div id="modemenu" role="menu" hidden>
      <button data-mode="edit" role="menuitemradio">
        <svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
        <span><b>Editing</b><small>Click into the page and type</small></span>
        <span class="tick">✓</span>
      </button>
      <button data-mode="view" role="menuitemradio">
        <svg viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
        <span><b>Viewing</b><small>Read-only, links clickable</small></span>
        <span class="tick">✓</span>
      </button>
    </div>
  </div>

  <span class="sep"></span>

  <button class="tb" id="browser" title="Open in browser — ⇧⌘B">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3.2 9h17.6M3.2 15h17.6"/><path d="M12 3a15 15 0 0 1 0 18 15 15 0 0 1 0-18Z"/></svg>
  </button>
</div>

<div id="findbar" hidden>
  <svg viewBox="0 0 24 24" class="fico"><circle cx="11" cy="11" r="7"/><path d="m20.5 20.5-4.2-4.2"/></svg>
  <input type="text" id="fq" placeholder="Find" autocomplete="off" spellcheck="false">
  <span id="fcount">0</span>
  <button class="tb sm" id="fprev" title="Previous — ⇧↩">
    <svg viewBox="0 0 24 24"><path d="m6 15 6-6 6 6"/></svg>
  </button>
  <button class="tb sm" id="fnext" title="Next — ↩">
    <svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>
  </button>
  <span class="sep"></span>
  <input type="text" id="fr" placeholder="Replace with" autocomplete="off" spellcheck="false">
  <button class="tb sm wide" id="frone">Replace</button>
  <button class="tb sm wide" id="frall">All</button>
  <label class="fcase"><input type="checkbox" id="fcase"> Aa</label>
  <span class="grow"></span>
  <button class="tb sm" id="fclose" title="Close — Esc">
    <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>
  </button>
</div>

<div id="stage">
  <iframe id="frame"></iframe>
  <div id="drop">
    <h2>Drop an .html file here</h2>
    <p>…or use <b>File ▸ Open…</b><br>
Opens ready to edit — just click into the page and type.<br>
    Click any link while editing to change its text or URL.</p>
    <p class="keys"><kbd>⌘O</kbd> open &nbsp; <kbd>⌘S</kbd> save &nbsp;
    <kbd>⌘E</kbd> edit/view &nbsp; <kbd>⌘F</kbd> find &nbsp; <kbd>⌘K</kbd> link &nbsp;
    <kbd>⌘D</kbd> trim</p>
  </div>
</div>

<div id="toast" hidden></div>

<dialog id="linkdlg">
  <h3 id="linktitle">Edit link</h3>
  <label for="ltext">Link text</label>
  <input type="text" id="ltext" autocomplete="off">
  <label for="lhref">URL</label>
  <input type="text" id="lhref" autocomplete="off" placeholder="https://… or #section-id">
  <div id="lwarn" hidden></div>
  <div class="row">
    <button id="lremove">Remove link</button>
    <span class="grow"></span>
    <button id="lcancel">Cancel</button>
    <button id="lok" class="primary">Apply</button>
  </div>
</dialog>

<dialog id="updatedlg">
  <div class="upd-head">
    <svg class="upd-icon" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M4 20h16"/>
    </svg>
    <div>
      <h3 id="upd-title">Update available</h3>
      <p class="upd-sub" id="upd-sub"></p>
    </div>
  </div>

  <div class="upd-notes" id="upd-notes" hidden></div>

  <a class="upd-link" id="upd-whatsnew" href="#" hidden>
    What’s new
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17 17 7"/><path d="M9 7h8v8"/></svg>
  </a>

  <div class="upd-progress" id="upd-progress" hidden>
    <div class="upd-bar"><div class="upd-fill" id="upd-fill"></div></div>
    <span class="upd-pct" id="upd-pct">0%</span>
  </div>

  <div class="row">
    <span class="grow"></span>
    <button id="upd-later">Later</button>
    <button id="upd-go" class="primary">Install update</button>
  </div>
</dialog>

<dialog id="auditdlg">
  <h3>Link audit</h3>
  <div id="auditsum"></div>
  <div id="auditlist"></div>
  <div class="row">
    <span class="grow"></span>
    <button id="aclose" class="primary">Close</button>
  </div>
</dialog>

<script type="module" src="/src/main.js"></script>
</body>
</html>
